[project]
name = "chatbot-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aysel Imanli", email = "imanli.aysel92@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.3.15",
    "langchain-openai>=1.5.1",
    "pypdf>=6.16.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "streamlit>=1.61.1",
]

[project.scripts]
chatbot-rag = "chatbot_rag:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
